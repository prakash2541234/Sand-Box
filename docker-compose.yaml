services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shipshape
      POSTGRES_USER: shipshape
      POSTGRES_PASSWORD: shipshape
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipshape -d shipshape"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://shipshape:shipshape@db:5432/shipshape
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

volumes:
  postgres-data:
